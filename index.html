<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UI/UX 디자이너 성대한 프로필페이지</title>
    <link rel="stylesheet" href="./css/reset.css">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/font.css">
    <link rel="stylesheet" href="./css/header.css">
    <link rel="stylesheet" href="./css/index.css">
    <script src="./js/header.js"></script>
    <script src="./js/index.js" defer></script>

</head>

<body>
    <!-- 스크롤과 함께 밀도가 바뀌는 고정 장식 레이어 -->
    <div class="cyber-backdrop" aria-hidden="true">
        <div class="cyber-grid"></div>
        <p class="cyber-code code-top">// SYSTEM : ONLINE&nbsp;&nbsp; 01.01.0101</p>
        <p class="cyber-code code-side">NEON_INTERFACE / PORTFOLIO / 2024</p>
        <p class="cyber-code code-bottom">[ VISUAL_SIGNAL ] &nbsp; 00FFFC &nbsp; // SYNCHRONIZED</p>
        <span class="cyber-ring ring-one"></span>
        <span class="cyber-ring ring-two"></span>
        <span class="cyber-line line-one"></span>
        <span class="cyber-line line-two"></span>
        <span class="cyber-square square-one"></span>
        <span class="cyber-square square-two"></span>
        <span class="cyber-cross cross-one">+</span>
    </div>
    <!-- 헤더 -->
    <header>
        <div class="header-top">
            <div class="common-frame">
                <div class="header-logo">
                    <img src="./img/header_logo.svg" alt="로고">
                </div>
                <div class="header-btn">
                    <ul>
                        <a href="#">
                            <li>ABOUT</li>
                        </a>
                        <a href="#">
                            <li>WORK</li>
                        </a>
                        <a href="#">
                            <li>PROJECT</li>
                        </a>
                    </ul>
                </div>
                <div class="header-dotsicn">
                    <img src="./img/header_icn_dots.svg" alt="이동아이콘">
                </div>
            </div>

        </div>
    </header>
    <div class="hero-banner">
        <div class="hero-banner-animation">

        </div>
        <h1 class="en">CORE DESIGN</h1>
        
    </div>
    
</body>

</html>
